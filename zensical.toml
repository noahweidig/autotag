[project]
site_name = "Autotag"
site_description = "Tag your Zotero library with an LLM, review every tag before it lands, and merge duplicate tags across the whole library."
site_author = "Noah Weidig"
site_url = "https://noahweidig.github.io/autotag/"
repo_url = "https://github.com/noahweidig/autotag"
repo_name = "noahweidig/autotag"
copyright = "Autotag is free and open source. AGPL-3.0-or-later."
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Set up a provider" = "providers.md" },
  { "Tag your items" = "usage.md" },
  { "Tag without AI" = "free-sources.md" },
  { "Tag Manager" = "tag-manager.md" },
  { "Settings" = "settings.md" },
  { "Privacy" = "privacy.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Credits and licenses" = "about.md" },
  { "Tags" = "tags.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
favicon = "favicon.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/tags"
repo = "octicons/mark-github-16"

[project.theme.icon.tag]
default = "lucide/hash"
tagging = "lucide/tags"
review = "lucide/list-checks"
manager = "lucide/merge"
providers = "lucide/plug"
settings = "lucide/settings"
privacy = "lucide/lock"
help = "lucide/life-buoy"
legal = "lucide/scale"
start = "lucide/rocket"
zotero = "lucide/library-big"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.tags]

[project.extra.tags]
"Tagging" = "tagging"
"Review" = "review"
"Tag Manager" = "manager"
"Providers" = "providers"
"Settings" = "settings"
"Privacy" = "privacy"
"Help" = "help"
"Legal" = "legal"
"Getting started" = "start"
"Zotero" = "zotero"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
