name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: npm ci --ignore-scripts

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: npm run build

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd .scaffold/build
          # update.json links to autotag.xpi, so publish the XPI under both names
          cp "autotag-$VERSION.xpi" autotag.xpi
          gh release create "v$VERSION" "autotag-$VERSION.xpi" autotag.xpi \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

      - name: Publish update manifests
        if: steps.version.outputs.exists == 'false'
        run: |
          cd .scaffold/build
          if gh release view release >/dev/null 2>&1; then
            gh release upload release update.json update-beta.json --clobber
          else
            gh release create release update.json update-beta.json \
              --target "$GITHUB_SHA" --title "Update manifests" \
              --notes "Update manifests read by Zotero's plugin updater. Do not delete." \
              --latest=false
          fi
